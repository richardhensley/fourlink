name = "fourlink"
main = "src/index.js"
compatibility_date = "2026-09-26"
routes = [
  { pattern = "fourlink.org", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"

[[send_email]]
name = "FEEDBACK"
destination_address = "rhensley99@msn.com"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
