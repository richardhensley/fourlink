<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4-Link Viewer</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  #panel { padding: 10px; overflow-y: auto; border-right: 1px solid #ccc; background: #fafafa; }
  #views { display: grid; grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; min-height: 0; }
  #three { position: relative; min-height: 0; }
  svg { width: 100%; height: 100%; min-height: 0; background: #fff; }
  #top { border-left: 1px solid #ccc; }
  #side { grid-column: 1 / 3; border-top: 1px solid #ccc; }
  h3 { margin: 12px 0 4px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 4px; border-bottom: 1px solid #eee; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .bad { color: #c00; font-weight: bold; }
  input[type=range] { width: 100%; }
  label { display: block; margin: 4px 0; }
  #err { color: #c00; white-space: pre-wrap; }
  .tabs { display: flex; margin: -10px -10px 8px; border-bottom: 1px solid #ccc; }
  .tabs button { flex: 1; padding: 8px; border: 0; background: #eee; cursor: pointer; font: inherit; }
  .tabs button.active { background: #fafafa; font-weight: bold; box-shadow: inset 0 -2px #1565c0; }
  .filebar { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .filebar label, .filebar button { margin: 0; padding: 3px 8px; border: 1px solid #999; border-radius: 3px; background: #fff; cursor: pointer; font: inherit; }
  #file { color: #666; font-size: 12px; margin-bottom: 6px; }
  fieldset { margin: 6px 0; padding: 4px 6px; border: 1px solid #ccc; }
  legend { font-weight: bold; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 2px 0; }
  .field > span:first-child { flex: 0 0 auto; }
  .inputs { display: flex; gap: 3px; justify-content: flex-end; flex: 1; min-width: 0; }
  .inputs input[type=text] { width: 100%; }
  .coords { color: #444; font-size: 12px; padding: 4px 6px; margin-bottom: 6px; background: #eef3fb; border: 1px solid #c5d5ee; border-radius: 3px; cursor: help; }
  .note { color: #666; font-size: 11px; font-style: italic; margin: 0 0 4px; }
  html, body { overflow: hidden; }
  #panel { box-sizing: border-box; height: 100vh; overflow-x: hidden; }
  #views { min-width: 0; overflow: hidden; }
  #three { overflow: hidden; }
  #three canvas { display: block; }
  .inputs input[type=number] { flex: 0 1 70px; width: 70px; min-width: 0; box-sizing: border-box; font-size: 12px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .inputs input[type=number]::-webkit-inner-spin-button, .inputs input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #help { position: fixed; z-index: 1000; width: 380px; background: #fffbe6; border: 3px solid #ff8f00; border-radius: 8px;
          box-shadow: 0 8px 28px rgba(0,0,0,.35); font-size: 14px; line-height: 1.4; overflow: hidden; pointer-events: none;
          animation: pop .12s ease-out; }
  #help::before { content: ""; position: absolute; left: -14px; top: calc(var(--arrow, 20px) - 11px);
          border: 11px solid transparent; border-right-color: #ff8f00; border-left: 0; }
  #help .help-title { background: #ff8f00; color: #fff; font-weight: bold; font-size: 15px; padding: 6px 12px; }
  #help .help-row { padding: 6px 12px; }
  #help .help-row + .help-row { border-top: 1px solid #f3dca0; }
  #help .help-row b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #e65100; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .q { display: inline-block; margin-left: 4px; width: 12px; height: 12px; line-height: 12px; text-align: center; border-radius: 50%; background: #ddd; color: #555; font-size: 9px; cursor: help; }
  tr[data-help]:hover, .field:hover, legend:hover { background: #fff3c4; }
  .glow line, .glow polygon { stroke: #ff6f00 !important; stroke-width: 1.4px; }
  .glow circle { stroke: #ff6f00; stroke-width: 0.8px; }
  .glow text { fill: #e65100 !important; font-weight: bold; }
  .glow { filter: drop-shadow(0 0 1px #ffb300); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs"
} }
</script>
</head>
<body>
<div id="panel">
  <div class="tabs">
    <button class="active" data-tab="calcs">Calculations</button>
    <button data-tab="data">Data entry</button>
  </div>
  <div id="data" class="tab" hidden>
    <div class="filebar">
      <label>Load YAML<input type="file" id="load" accept=".yaml,.yml" hidden></label>
      <button id="save">Save YAML</button>
      <button id="apply">Apply</button>
    </div>
    <div id="file"></div>
    <div id="form"></div>
  </div>
  <div id="calcs" class="tab">
  <div class="coords" data-help="data:coords" data-hl="joints" data-title="Coordinate system">X from rear axle centerline, Y from vehicle centerline, Z from frame bottom. Axle points are entered from axle center.<span class="q">?</span></div>
  <label data-help="calc:hole" data-hl="uf" data-title="UF hole">UF hole <select id="hole"></select><span class="q">?</span></label>
  <h3 data-help="calc:cg" data-hl="as">CG height<span class="q">?</span></h3>
  <label><span id="cgv"></span><input type="range" id="cg" step="0.25"></label>
  <h3 data-help="calc:travel" data-hl="axle">Wheel travel at wheel center (+ bump)<span class="q">?</span></h3>
  <label>Driver <span id="zlv"></span><input type="range" id="zl" step="0.25"></label>
  <label>Passenger <span id="zrv"></span><input type="range" id="zr" step="0.25"></label>
  <label><input type="checkbox" id="lock"> Lock sides (heave)</label>
  <button id="reset">Ride height</button>
  <h3>Static (ride height)</h3>
  <table id="static"></table>
  <h3>At current travel</h3>
  <table id="pose"></table>
  </div>
  <div id="err"></div>

</div>
<div id="views">
  <div id="three"></div>
  <svg id="top"></svg>
  <svg id="side"></svg>
</div>
<div id="help" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
